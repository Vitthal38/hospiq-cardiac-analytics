<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HOSPIQ — Cardiac Analytics Dashboard</title>
  <style>
    :root {
      --navy: #0d1b2a;
      --blue: #185fa5;
      --ink: #1f2933;
      --muted: #6b7280;
      --line: #e5e7eb;
      --bg: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
    }
    header {
      background: var(--navy);
      color: #fff;
      padding: 40px 20px 28px;
      text-align: center;
    }
    header h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.02em; }
    header p { color: #a9c1d9; margin-top: 8px; font-size: 1rem; }
    nav {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 28px;
      padding: 16px 20px; border-bottom: 1px solid var(--line);
      background: #f8fafc; font-size: 0.95rem;
    }
    nav a { color: var(--blue); text-decoration: none; font-weight: 600; }
    nav a:hover { text-decoration: underline; }
    nav span { color: var(--muted); }
    .stats {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 0;
      max-width: 1000px; margin: 28px auto 8px; padding: 0 16px;
    }
    .stat {
      flex: 1 1 200px; text-align: center; padding: 14px 10px;
      border-right: 1px solid var(--line);
    }
    .stat:last-child { border-right: none; }
    .stat .num { font-size: 1.5rem; font-weight: 700; color: var(--navy); }
    .stat .lbl { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
    figure {
      margin: 32px 0; border: 1px solid var(--line); border-radius: 10px;
      overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    figure img { width: 100%; height: auto; display: block; }
    figcaption {
      padding: 12px 16px; font-weight: 600; color: var(--ink);
      background: #f8fafc; border-top: 1px solid var(--line);
    }
    footer {
      text-align: center; padding: 28px 20px; color: var(--muted);
      font-size: 0.85rem; border-top: 1px solid var(--line);
    }
    footer a { color: var(--blue); text-decoration: none; }
    @media (max-width: 640px) {
      header h1 { font-size: 1.4rem; }
      .stat { flex-basis: 45%; border-right: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>HOSPIQ — Cardiac Analytics Dashboard</h1>
    <p>Hero DMC Heart Institute&nbsp;|&nbsp;15,757 Admissions&nbsp;|&nbsp;Apr 2017–Mar 2019</p>
  </header>

  <nav>
    <a href="https://github.com/Vitthal38/hospiq-cardiac-analytics" target="_blank" rel="noopener">GitHub Repo</a>
    <span>Author&nbsp;→&nbsp;Vitthal Misal | Data Analyst</span>
  </nav>

  <section class="stats">
    <div class="stat"><div class="num">15,757</div><div class="lbl">Admissions</div></div>
    <div class="stat"><div class="num">7.01%</div><div class="lbl">Mortality</div></div>
    <div class="stat"><div class="num">69.33%</div><div class="lbl">Emergency</div></div>
    <div class="stat"><div class="num">6.42</div><div class="lbl">Avg LOS (days)</div></div>
  </section>

  <main>
    <figure>
      <img src="screenshots/01_clinical_overview.png" alt="Clinical Overview dashboard page" />
      <figcaption>Page 1 — Clinical Overview</figcaption>
    </figure>
    <figure>
      <img src="screenshots/02_risk_intelligence.png" alt="Risk Intelligence dashboard page" />
      <figcaption>Page 2 — Risk Intelligence</figcaption>
    </figure>
    <figure>
      <img src="screenshots/03_rural_vs_urban.png" alt="Rural vs Urban dashboard page" />
      <figcaption>Page 3 — Rural vs Urban</figcaption>
    </figure>
    <figure>
      <img src="screenshots/04_patient_cohort_detail.png" alt="Patient Cohort Detail drill-through page" />
      <figcaption>Page 4 — Patient Cohort Detail</figcaption>
    </figure>
    <figure>
      <img src="screenshots/05_condition_tooltip.png" alt="Condition Tooltip custom tooltip page" />
      <figcaption>Page 5 — Condition Tooltip</figcaption>
    </figure>
  </main>

  <footer>
    Built with Python · AWS S3 · PostgreSQL · Power BI ·
    <a href="https://github.com/Vitthal38/hospiq-cardiac-analytics" target="_blank" rel="noopener">View source on GitHub</a>
  </footer>
</body>
</html>
